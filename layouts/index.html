{{ define "main" }}
<div class="home-layout">
  <!-- Hero / Bio Section -->
  <section class="home-hero">
    <table class="bio-table">
      <tbody>
        <tr class="bio-row-lead">
          <td class="logocol">
            <img src="{{ "images/profile.png" | relURL }}" alt="Mayank" class="bio-avatar" width="60" height="60" />
          </td>
          <td class="bio-cell">
            <div class="bio-lead">
              Hi! I am <b class="bio-name">Mayank</b> <span class="bio-handle">({{ site.Params.handle }})</span>. {{ site.Params.bio }}
            </div>
          </td>
        </tr>
        {{ range site.Data.home.lines }}
          <tr>
            <td class="logocol">
              <span class="homelogo-ico">{{ partial "icon.html" .icon }}</span>
            </td>
            <td class="bio-cell">{{ .text | safeHTML }}</td>
          </tr>
        {{ end }}
      </tbody>
    </table>
  </section>
</div>
{{ end }}
