<header class="site-header">
  <div class="header-inner">
    <nav class="site-nav" aria-label="Main navigation">
      {{- $currentPage := . -}}
      {{- range $index, $item := site.Menus.main -}}
        {{- $isActive := false -}}
        {{- if eq .URL "/" -}}
          {{- $isActive = $currentPage.IsHome -}}
        {{- else -}}
          {{- $isActive = in $currentPage.RelPermalink .URL -}}
        {{- end -}}
        <a class="nav-item{{ if $isActive }} is-active{{ end }}" href="{{ .URL | relURL }}" data-nav-index="{{ $index }}">
          <span class="nav-brush-bg" aria-hidden="true"></span>
          <span class="nav-label">{{ .Name }}</span>
        </a>
      {{- end -}}
    </nav>
  </div>
</header>
