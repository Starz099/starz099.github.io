<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

{{ $desc := site.Params.description }}
{{ with .Description }}{{ $desc = . }}{{ end }}
{{ $ogTitle := .Title }}
{{ if or .IsHome (not $ogTitle) }}{{ $ogTitle = site.Title }}{{ end }}

<title>Mayank</title>
<meta name="description" content="{{ $desc }}" />
<meta name="author" content="{{ site.Params.author }}" />

<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:title" content="{{ $ogTitle }}" />
<meta property="og:description" content="{{ $desc }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ site.Title }}" />
<meta property="og:image" content="{{ "og.png" | absURL }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ $ogTitle }}" />
<meta name="twitter:description" content="{{ $desc }}" />
<meta name="twitter:image" content="{{ "og.png" | absURL }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}?v={{ now.Unix }}" />
<link rel="icon" href="{{ "favicon.ico" | relURL }}" />
{{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}" />
{{ end }}
