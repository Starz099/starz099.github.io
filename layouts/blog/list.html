{{ define "main" }}
  {{ partial "page-header.html" (dict "title" .Title "description" .Params.description "accent" "sky") }}

  <div class="blog-cards">
    {{ range .Pages.ByDate.Reverse }}
      <a class="blog-card" href="{{ .RelPermalink }}">
        <span class="blog-card-date">{{ .Date.Format "2006-01-02" }}</span>
        <h2 class="blog-card-title">{{ .Title }}</h2>
        <p class="blog-card-desc">{{ .Params.description }}</p>
        <span class="blog-card-more">Read →</span>
      </a>
    {{ end }}
  </div>
{{ end }}
